# Serves the built console and forwards /api/* to the FastAPI service (prefix stripped, so /api/cases -> /cases).
# Security headers are set once at server level: nginx drops inherited add_header values in any location that declares its own, so no location below declares one.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving lazily lets this container start before the API is healthy.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server_tokens off;
    client_max_body_size 64k;   # an alert is ~21 small fields; nothing here needs more

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        set $upstream http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        # Responses carry case data and must never be cached by a shared cache.
        proxy_hide_header Cache-Control;
        expires -1;
    }

    # Hashed build output: safe to cache for a year.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # index.html names the hashed files, so it must always be revalidated.
    location = /index.html {
        expires -1;
    }

    # Single-page app: unknown paths serve the shell and the in-app router shows the 404 page.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
